<header class="topbar"><div class="identity"><h1 id="project-name"></h1></div><nav class="actions" aria-label="画布操作"><button id="display-toggle" aria-haspopup="dialog" aria-expanded="false">显示</button><div id="display-menu" role="dialog" aria-label="显示选项" hidden><fieldset><legend>样式</legend><button data-option="style" data-value="default">默认</button><button data-option="style" data-value="mono">简约黑白</button></fieldset><fieldset><legend>连线</legend><button data-option="edges" data-value="curve">曲线</button><button data-option="edges" data-value="orthogonal">直角</button></fieldset><fieldset><legend>方向</legend><button data-option="direction" data-value="balanced">两侧平衡</button><button data-option="direction" data-value="right">全部朝右</button></fieldset></div><button id="theme">深色</button><button id="collapse">收起到第二层</button><button id="expand">展开全部</button><button id="home" class="primary">回到中心</button><button id="open-feedback">批注 <span id="feedback-count">0</span></button></nav></header>
<main><section class="stage" id="stage" aria-label="项目画布"><div class="context"><strong>从主干，走进项目</strong>点标题看详情 · 点数字展开</div><svg id="canvas" class="canvas" role="group" aria-label="可平移缩放的项目概览" tabindex="0"><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="context-stroke" stroke-width="1.3"/></marker></defs><g id="world"></g></svg><div class="status" id="status"></div><div class="zoom" aria-label="缩放"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="放大">＋</button></div></section><section class="outline" id="outline" aria-label="可折叠项目大纲"></section><aside class="panel" id="panel" aria-label="节点详情与批注" hidden><div class="panel-top"><span>深入一层</span><button class="close" id="close" aria-label="关闭详情">×</button></div><div id="panel-body" class="panel-body"></div><div class="notes"><label for="note">给这个节点留个批注</label><textarea id="note" maxlength="2000" placeholder="哪里需要解释或调整？"></textarea><div class="note-bottom"><small id="note-status">仅当前页面，刷新即清空</small><button id="save-note">加入反馈</button></div></div></aside></main>
<dialog id="feedback-dialog"><div class="dialog-head"><h2>项目概览反馈</h2><button id="close-feedback" aria-label="关闭反馈">×</button></div><div class="dialog-body"><div id="feedback-items"></div><label for="overall-note">整体意见</label><textarea id="overall-note" maxlength="4000" placeholder="对项目全貌或阅读方式的意见"></textarea><div id="copy-fallback" hidden><p>剪贴板不可用，请手动全选复制。</p><textarea id="copy-text" readonly aria-label="可手动复制的完整反馈"></textarea><button id="select-copy-text">全选反馈</button></div></div><div class="dialog-footer"><small id="feedback-status"></small><button id="copy-feedback">一键复制</button></div></dialog>
